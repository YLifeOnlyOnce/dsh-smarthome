<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>dsh-smarthome banner</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #04060b; }
  #scene { position: absolute; inset: 0; }
  .overlay {
    position: absolute; inset: 0; z-index: 2; pointer-events: none;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 175px 0 0 62px;
  }
  .title {
    font-size: 54px; font-weight: 800; letter-spacing: -1px; color: #f2f5fa;
    text-shadow: 0 0 18px rgba(77, 124, 254, .55), 0 0 46px rgba(77, 124, 254, .28);
  }
  .title .dot { color: #6ee7b7; text-shadow: 0 0 14px rgba(110, 231, 183, .8); }
  .zh1 { margin-top: 14px; font-size: 25px; color: #cfd8e6; font-weight: 700; }
  .zh2 {
    margin-top: 5px; font-size: 25px; font-weight: 800; color: #8fb2ff;
    text-shadow: 0 0 16px rgba(77, 124, 254, .45);
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="overlay">
  <div class="title">dsh-smarthome<span class="dot">.</span></div>
  <div class="zh1">一个插件接入 Home Assistant</div>
  <div class="zh2">完成智能家居全闭环</div>
</div>
<script>
const canvas = document.getElementById('scene')
const ctx = canvas.getContext('2d')

const W = 1280, H = 640
canvas.width = W * 2
canvas.height = H * 2
canvas.style.width = W + 'px'
canvas.style.height = H + 'px'
ctx.scale(2, 2)

const TAU = Math.PI * 2
const rand = (a, b) => a + Math.random() * (b - a)

// ---------------------------------------------------------------------------
// 背景：DeepSeek 官网风格的粒子海浪
// ---------------------------------------------------------------------------
const WAVE_PARTICLES = []
const WAVE_COLS = 150
const WAVE_ROWS = 16
for (let row = 0; row < WAVE_ROWS; row++) {
  for (let col = 0; col < WAVE_COLS; col++) {
    const bx = (col / (WAVE_COLS - 1)) * W + rand(-4, 4)
    const by = (row / (WAVE_ROWS - 1)) * (H - 30) + 15 + rand(-3, 3)
    WAVE_PARTICLES.push({ bx, by, x: bx, y: by, size: rand(0.8, 1.9), phase: rand(0, TAU), drift: rand(-0.25, 0.25) })
  }
}

function waveY(p, t) {
  return p.by
    + Math.sin(p.bx * 0.007 + t * 0.0011 + p.phase) * 16
    + Math.sin(p.bx * 0.018 + t * 0.0024) * 7
    + Math.sin(p.bx * 0.0035 - t * 0.0007) * 22
}

function drawParticles(t) {
  for (const p of WAVE_PARTICLES) {
    p.x = p.bx + Math.sin(t * 0.0005 + p.phase) * 4 + p.drift * 30
    p.y = waveY(p, t)
    const crest = Math.max(0, (p.y - p.by) / 45)
    const alpha = 0.25 + crest * 0.75
    ctx.fillStyle = `rgba(${80 + crest * 40}, ${150 + crest * 60}, ${110 + crest * 100}, ${alpha})`
    const s = p.size * (1 + crest * 1.6)
    ctx.fillRect(p.x, p.y, s, s)
  }
}

// ---------------------------------------------------------------------------
// 链路：DSH → HA → 设备（极简）
// ---------------------------------------------------------------------------
const DSH = { x: 700, y: 250, w: 156, h: 64 }
const HA = { x: 955, y: 250, w: 156, h: 64 }

function roundRect(x, y, w, h, r) {
  ctx.beginPath()
  ctx.moveTo(x + r, y)
  ctx.arcTo(x + w, y, x + w, y + h, r)
  ctx.arcTo(x + w, y + h, x, y + h, r)
  ctx.arcTo(x, y + h, x, y, r)
  ctx.arcTo(x, y, x + w, y, r)
  ctx.closePath()
}

function drawNode(n, color, name, sub, t) {
  const [r, g, b] = color.split(',').map(Number)
  const glow = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, 110)
  glow.addColorStop(0, `rgba(${r},${g},${b},0.20)`)
  glow.addColorStop(1, `rgba(${r},${g},${b},0)`)
  ctx.fillStyle = glow
  ctx.fillRect(n.x - 110, n.y - 110, 220, 220)
  roundRect(n.x - n.w / 2, n.y - n.h / 2, n.w, n.h, 16)
  ctx.fillStyle = 'rgba(13, 16, 22, 0.92)'
  ctx.fill()
  ctx.strokeStyle = `rgba(${r},${g},${b},0.55)`
  ctx.lineWidth = 1.6
  ctx.stroke()
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'
  ctx.font = '800 26px system-ui, sans-serif'
  ctx.fillStyle = '#f2f5fa'
  ctx.fillText(name, n.x, n.y - 9)
  ctx.font = '500 12px system-ui, "PingFang SC", sans-serif'
  ctx.fillStyle = '#8b93a1'
  ctx.fillText(sub, n.x, n.y + 15)
}

function drawLink(from, to, t) {
  const dx = to.x - from.x, dy = to.y - from.y
  const off = (t * 0.0006) % 1
  const px = from.x + dx * off, py = from.y + dy * off
  const grad = ctx.createLinearGradient(from.x, from.y, to.x, to.y)
  grad.addColorStop(0, 'rgba(77,124,254,0.7)')
  grad.addColorStop(1, 'rgba(110,231,183,0.7)')
  ctx.strokeStyle = grad
  ctx.lineWidth = 2.2
  ctx.setLineDash([9, 7])
  ctx.lineDashOffset = -t * 0.12
  ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(to.x, to.y); ctx.stroke()
  ctx.setLineDash([])
  const g1 = ctx.createRadialGradient(px, py, 0, px, py, 7)
  g1.addColorStop(0, 'rgba(190, 242, 255, 0.95)')
  g1.addColorStop(1, 'rgba(190, 242, 255, 0)')
  ctx.fillStyle = g1
  ctx.beginPath(); ctx.arc(px, py, 7, 0, TAU); ctx.fill()
  ctx.font = '500 12px system-ui, "PingFang SC", sans-serif'
  ctx.fillStyle = '#9aa6b8'
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'
  ctx.fillText('一键接入', (from.x + to.x) / 2, Math.min(from.y, to.y) - 12)
}

// ---------------------------------------------------------------------------
// 设备：三个发光图标（无边框、无文字、无状态点）
// ---------------------------------------------------------------------------
const DEVICES = [
  { icon: '💡', x: 1120, y: 250, color: '251,191,36' },
  { icon: '❄️', x: 1178, y: 250, color: '96,165,250' },
  { icon: '🔒', x: 1236, y: 250, color: '110,231,183' },
]

function drawDevices(t) {
  // HA 到设备组的柔和光束
  const beam = ctx.createLinearGradient(HA.x + 80, HA.y, 1120, 250)
  beam.addColorStop(0, 'rgba(110,231,183,0.35)')
  beam.addColorStop(1, 'rgba(110,231,183,0)')
  ctx.strokeStyle = beam
  ctx.lineWidth = 2
  ctx.beginPath(); ctx.moveTo(HA.x + 80, HA.y); ctx.lineTo(1090, 250); ctx.stroke()

  for (let i = 0; i < DEVICES.length; i++) {
    const d = DEVICES[i]
    const [r, g, b] = d.color.split(',').map(Number)
    const breathe = 0.5 + 0.5 * Math.sin(t * 0.0018 + i * 1.4)
    const glow = ctx.createRadialGradient(d.x, d.y, 0, d.x, d.y, 30)
    glow.addColorStop(0, `rgba(${r},${g},${b},${0.30 + 0.25 * breathe})`)
    glow.addColorStop(1, `rgba(${r},${g},${b},0)`)
    ctx.fillStyle = glow
    ctx.beginPath(); ctx.arc(d.x, d.y, 30, 0, TAU); ctx.fill()
    ctx.font = '27px system-ui, "PingFang SC", sans-serif'
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'
    ctx.fillText(d.icon, d.x, d.y + 1)
  }
}

// ---------------------------------------------------------------------------
// 主循环
// ---------------------------------------------------------------------------
const start = performance.now()
function frame(now) {
  const t = now - start
  ctx.clearRect(0, 0, W, H)
  drawParticles(t)
  drawLink(DSH, HA, t)
  drawNode(DSH, '77,124,254', 'DSH', 'DeepSeek Harness', t)
  drawNode(HA, '110,231,183', 'HA', 'Home Assistant', t)
  drawDevices(t)
  requestAnimationFrame(frame)
}
requestAnimationFrame(frame)
</script>
</body>
</html>
