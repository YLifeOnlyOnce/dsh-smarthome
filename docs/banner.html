<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>dsh-smarthome banner</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05070d; }
  #scene { position: absolute; inset: 0; }
  .overlay {
    position: absolute; inset: 0; z-index: 2; pointer-events: none;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 158px 0 0 68px;
  }
  .title {
    font-size: 64px; font-weight: 800; letter-spacing: -1.5px; color: #f4f7fc;
    text-shadow: 0 0 22px rgba(77, 124, 254, .5), 0 0 60px rgba(77, 124, 254, .22);
  }
  .title .dot { color: #6ee7b7; text-shadow: 0 0 16px rgba(110, 231, 183, .85); }
  .bar {
    width: 66px; height: 4px; border-radius: 4px; margin-top: 18px;
    background: linear-gradient(90deg, #38bdf8, #2dd4bf);
    box-shadow: 0 0 14px rgba(56, 189, 248, .6);
  }
  .zh1 { margin-top: 18px; font-size: 27px; color: #d3dbe8; font-weight: 700; letter-spacing: .5px; }
  .zh2 {
    margin-top: 6px; font-size: 27px; font-weight: 800; color: #93b4ff; letter-spacing: .5px;
    text-shadow: 0 0 20px rgba(77, 124, 254, .4);
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="overlay">
  <div class="title">dsh-smarthome<span class="dot">.</span></div>
  <div class="bar"></div>
  <div class="zh1">一个插件接入 Home Assistant</div>
  <div class="zh2">完成智能家居全闭环</div>
</div>
<script>
const canvas = document.getElementById('scene')
const ctx = canvas.getContext('2d')

const W = 1280, H = 640
canvas.width = W * 2
canvas.height = H * 2
canvas.style.width = W + 'px'
canvas.style.height = H + 'px'
ctx.scale(2, 2)

const TAU = Math.PI * 2

// ---------------------------------------------------------------------------
// 背景：深色渐变 + 大面积柔和光晕 + 一条优雅的弧线（无粒子）
// ---------------------------------------------------------------------------
function drawBackground() {
  // 基底
  const base = ctx.createLinearGradient(0, 0, 0, H)
  base.addColorStop(0, '#060a13')
  base.addColorStop(0.55, '#081020')
  base.addColorStop(1, '#0a1426')
  ctx.fillStyle = base
  ctx.fillRect(0, 0, W, H)

  // 右上大面积蓝光（衬管道）
  const glowA = ctx.createRadialGradient(1010, 210, 0, 1010, 210, 500)
  glowA.addColorStop(0, 'rgba(77, 124, 254, 0.20)')
  glowA.addColorStop(0.5, 'rgba(56, 130, 246, 0.08)')
  glowA.addColorStop(1, 'rgba(56, 130, 246, 0)')
  ctx.fillStyle = glowA
  ctx.fillRect(0, 0, W, H)

  // 左下青绿光（衬文字区底部）
  const glowB = ctx.createRadialGradient(180, 560, 0, 180, 560, 430)
  glowB.addColorStop(0, 'rgba(45, 212, 191, 0.10)')
  glowB.addColorStop(1, 'rgba(45, 212, 191, 0)')
  ctx.fillStyle = glowB
  ctx.fillRect(0, 0, W, H)

  // 一条优雅的弧线（地平线般的气韵）
  ctx.beginPath()
  ctx.moveTo(0, 600)
  ctx.quadraticCurveTo(640, 510, 1280, 600)
  const arc = ctx.createLinearGradient(0, 0, W, 0)
  arc.addColorStop(0, 'rgba(56,189,248,0)')
  arc.addColorStop(0.5, 'rgba(56,189,248,0.28)')
  arc.addColorStop(1, 'rgba(110,231,183,0)')
  ctx.strokeStyle = arc
  ctx.lineWidth = 1.4
  ctx.stroke()
}

// ---------------------------------------------------------------------------
// DSH → HA 玻璃芯片 + 连接线
// ---------------------------------------------------------------------------
const DSH = { x: 740, y: 250, w: 170, h: 66 }
const HA = { x: 985, y: 250, w: 170, h: 66 }

function roundRect(x, y, w, h, r) {
  ctx.beginPath()
  ctx.moveTo(x + r, y)
  ctx.arcTo(x + w, y, x + w, y + h, r)
  ctx.arcTo(x + w, y + h, x, y + h, r)
  ctx.arcTo(x, y + h, x, y, r)
  ctx.arcTo(x, y, x + w, y, r)
  ctx.closePath()
}

function drawChip(n, accent, name, sub, t, size = 26) {
  const [r, g, b] = accent.split(',').map(Number)
  // 底部柔光
  const glow = ctx.createRadialGradient(n.x, n.y + 10, 0, n.x, n.y + 10, 90)
  glow.addColorStop(0, `rgba(${r},${g},${b},0.22)`)
  glow.addColorStop(1, `rgba(${r},${g},${b},0)`)
  ctx.fillStyle = glow
  ctx.fillRect(n.x - 90, n.y - 80, 180, 180)
  // 玻璃主体
  roundRect(n.x - n.w / 2, n.y - n.h / 2, n.w, n.h, 18)
  ctx.fillStyle = 'rgba(13, 18, 28, 0.86)'
  ctx.fill()
  ctx.strokeStyle = `rgba(${r},${g},${b},0.45)`
  ctx.lineWidth = 1.4
  ctx.stroke()
  // 顶部高光
  const hi = ctx.createLinearGradient(0, n.y - n.h / 2, 0, n.y - n.h / 2 + n.h / 2)
  hi.addColorStop(0, `rgba(255,255,255,0.07)`)
  hi.addColorStop(1, 'rgba(255,255,255,0)')
  ctx.fillStyle = hi
  roundRect(n.x - n.w / 2, n.y - n.h / 2, n.w, n.h / 2, 18)
  ctx.fill()
  // 文字
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'
  ctx.font = `800 ${size}px system-ui, sans-serif`
  ctx.fillStyle = '#f4f7fc'
  if (sub) {
    ctx.fillText(name, n.x, n.y - 9)
    ctx.font = '500 11.5px system-ui, "PingFang SC", sans-serif'
    ctx.fillStyle = '#8b93a1'
    ctx.fillText(sub, n.x, n.y + 15)
  } else {
    ctx.fillText(name, n.x, n.y)
  }
}

function drawConnector(t) {
  const x1 = DSH.x + DSH.w / 2, x2 = HA.x - HA.w / 2, y = DSH.y
  const grad = ctx.createLinearGradient(x1, 0, x2, 0)
  grad.addColorStop(0, 'rgba(77,124,254,0.8)')
  grad.addColorStop(1, 'rgba(110,231,183,0.8)')
  ctx.strokeStyle = grad
  ctx.lineWidth = 1.8
  ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x2, y); ctx.stroke()
  // 流动光点
  const off = (t * 0.00055) % 1
  const px = x1 + (x2 - x1) * off
  const g1 = ctx.createRadialGradient(px, y, 0, px, y, 6.5)
  g1.addColorStop(0, 'rgba(200,245,255,0.95)')
  g1.addColorStop(1, 'rgba(200,245,255,0)')
  ctx.fillStyle = g1
  ctx.beginPath(); ctx.arc(px, y, 6.5, 0, TAU); ctx.fill()
  // 标签
  ctx.font = '500 11px system-ui, "PingFang SC", sans-serif'
  ctx.fillStyle = '#8b93a1'
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'
  ctx.fillText('一键接入', (x1 + x2) / 2, y - 16)
}

// ---------------------------------------------------------------------------
// 一盏发光的灯（点题：控制灯）
// ---------------------------------------------------------------------------
function drawLight(t) {
  const x = 1195, y = 250
  const breathe = 0.5 + 0.5 * Math.sin(t * 0.0016)
  // 巨大柔和光晕
  const halo = ctx.createRadialGradient(x, y, 0, x, y, 150)
  halo.addColorStop(0, `rgba(251,191,36,${0.20 + 0.08 * breathe})`)
  halo.addColorStop(0.4, 'rgba(251,191,36,0.06)')
  halo.addColorStop(1, 'rgba(251,191,36,0)')
  ctx.fillStyle = halo
  ctx.beginPath(); ctx.arc(x, y, 150, 0, TAU); ctx.fill()
  // 半环（优雅的靶环）
  ctx.beginPath(); ctx.arc(x, y, 46, Math.PI * 0.9, Math.PI * 1.85)
  ctx.strokeStyle = `rgba(251,191,36,${0.45 + 0.2 * breathe})`
  ctx.lineWidth = 1.6
  ctx.stroke()
  // 图标
  ctx.font = '40px system-ui, "PingFang SC", sans-serif'
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'
  ctx.fillText('💡', x, y + 1)
}

// ---------------------------------------------------------------------------
// 主循环
// ---------------------------------------------------------------------------
const start = performance.now()
function frame(now) {
  const t = now - start
  ctx.clearRect(0, 0, W, H)
  drawBackground()
  drawConnector(t)
  drawChip(DSH, '77,124,254', 'DSH', 'DeepSeek Harness', t)
  drawChip(HA, '110,231,183', 'Home Assistant', '', t, 19)
  drawLight(t)
  requestAnimationFrame(frame)
}
requestAnimationFrame(frame)
</script>
</body>
</html>
