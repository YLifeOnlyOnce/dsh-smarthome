<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>dsh-smarthome banner</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #04060b; }
  #scene { position: absolute; inset: 0; }
  .overlay {
    position: absolute; inset: 0; z-index: 2; pointer-events: none;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 96px 0 0 90px;
  }
  .title {
    font-size: 74px; font-weight: 800; letter-spacing: -1px; color: #f2f5fa;
    text-shadow: 0 0 18px rgba(77, 124, 254, .55), 0 0 46px rgba(77, 124, 254, .28);
  }
  .title .dot { color: #6ee7b7; text-shadow: 0 0 14px rgba(110, 231, 183, .8); }
  .sub { margin-top: 14px; font-size: 27px; color: #9aa6b8; font-weight: 500; }
  .sub b { color: #cfd8e6; font-weight: 600; }
  .zh { margin-top: 8px; font-size: 21px; color: #6d7a90; }
  .zh em { color: #8b93a1; font-style: normal; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="overlay">
  <div class="title">dsh-smarthome<span class="dot">.</span></div>
  <div class="sub">Home Assistant × <b>DeepSeek Harness</b></div>
  <div class="zh">让 AI 帮你<em>控制灯、空调、门锁……整个家</em></div>
</div>
<script>
const canvas = document.getElementById('scene')
const ctx = canvas.getContext('2d')

const W = 1600, H = 500
canvas.width = W * 2
canvas.height = H * 2
canvas.style.width = W + 'px'
canvas.style.height = H + 'px'
ctx.scale(2, 2)

const TAU = Math.PI * 2
const rand = (a, b) => a + Math.random() * (b - a)

// ---------------------------------------------------------------------------
// 粒子网络（漂浮星光 + 邻近连线）
// ---------------------------------------------------------------------------
const PARTICLES = []
for (let i = 0; i < 150; i++) {
  PARTICLES.push({
    x: rand(0, W), y: rand(0, H),
    r: rand(0.6, 2.2),
    vx: rand(-0.18, 0.18), vy: rand(-0.12, 0.12),
    phase: rand(0, TAU),
    speed: rand(0.4, 1.2),
    hue: Math.random() < 0.78 ? [77, 124, 254] : (Math.random() < 0.5 ? [110, 231, 183] : [251, 191, 36]),
  })
}
function drawParticles(t) {
  for (const p of PARTICLES) {
    p.x += p.vx * p.speed; p.y += p.vy * p.speed
    if (p.x < -10) p.x = W + 10; if (p.x > W + 10) p.x = -10
    if (p.y < -10) p.y = H + 10; if (p.y > H + 10) p.y = -10
  }
  for (let i = 0; i < PARTICLES.length; i++) {
    const a = PARTICLES[i]
    for (let j = i + 1; j < PARTICLES.length; j++) {
      const b = PARTICLES[j]
      const dx = a.x - b.x, dy = a.y - b.y
      const d2 = dx * dx + dy * dy
      if (d2 < 90 * 90) {
        const alpha = (1 - Math.sqrt(d2) / 90) * 0.16
        ctx.strokeStyle = `rgba(110, 160, 255, ${alpha})`
        ctx.lineWidth = 1
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke()
      }
    }
  }
  for (const p of PARTICLES) {
    const tw = 0.5 + 0.5 * Math.sin(t * 0.002 + p.phase)
    const [r, g, b] = p.hue
    ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${0.35 + 0.6 * tw})`
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (0.7 + 0.6 * tw), 0, TAU); ctx.fill()
  }
}

// ---------------------------------------------------------------------------
// 智能家居设备节点（固定位置 + 呼吸光圈 + 控制信号脉冲）
// ---------------------------------------------------------------------------
const HUB = { x: 1050, y: 250 }
const DEVICES = [
  { icon: '💡', x: 1260, y: 130, color: '251,191,36', name: 'light' },
  { icon: '❄️', x: 1460, y: 175, color: '96,165,250', name: 'climate' },
  { icon: '🔌', x: 1525, y: 330, color: '110,231,183', name: 'switch' },
  { icon: '📺', x: 1350, y: 420, color: '129,140,248', name: 'media' },
  { icon: '🎥', x: 1140, y: 405, color: '251,146,60', name: 'camera' },
  { icon: '🎬', x: 940, y: 385, color: '232,121,249', name: 'scene' },
  { icon: '🔒', x: 830, y: 250, color: '110,231,183', name: 'lock' },
  { icon: '🚪', x: 960, y: 120, color: '148,163,184', name: 'door' },
]

function pulse(t, dev, i) {
  const dx = dev.x - HUB.x, dy = dev.y - HUB.y
  const len = Math.hypot(dx, dy)
  // 控制信号沿连线传播的亮点
  const off = (t * 0.00028 + i * 0.16) % 1
  const px = HUB.x + dx * off, py = HUB.y + dy * off
  const [r, g, b] = dev.color.split(',').map(Number)
  const g1 = ctx.createRadialGradient(px, py, 0, px, py, 7)
  g1.addColorStop(0, `rgba(${r},${g},${b},0.9)`)
  g1.addColorStop(1, `rgba(${r},${g},${b},0)`)
  ctx.fillStyle = g1
  ctx.beginPath(); ctx.arc(px, py, 7, 0, TAU); ctx.fill()
  // 连线本身（低透明）
  ctx.strokeStyle = `rgba(${r},${g},${b},0.28)`
  ctx.lineWidth = 1.4
  ctx.beginPath(); ctx.moveTo(HUB.x, HUB.y); ctx.lineTo(dev.x, dev.y); ctx.stroke()
}

function drawHub(t) {
  // 呼吸光环
  for (let k = 3; k >= 1; k--) {
    const rr = 30 + ((t * 0.0009 + k * 0.33) % 1) * 46
    ctx.strokeStyle = `rgba(77, 124, 254, ${0.34 * (1 - (rr - 30) / 46)})`
    ctx.lineWidth = 1.6
    ctx.beginPath(); ctx.arc(HUB.x, HUB.y, rr, 0, TAU); ctx.stroke()
  }
  // 核心
  const core = ctx.createRadialGradient(HUB.x, HUB.y, 0, HUB.x, HUB.y, 34)
  core.addColorStop(0, 'rgba(77,124,254,0.95)')
  core.addColorStop(1, 'rgba(77,124,254,0)')
  ctx.fillStyle = core
  ctx.beginPath(); ctx.arc(HUB.x, HUB.y, 34, 0, TAU); ctx.fill()
  ctx.fillStyle = 'rgba(110,231,183,0.85)'
  ctx.beginPath(); ctx.arc(HUB.x, HUB.y, 3.2, 0, TAU); ctx.fill()
  ctx.font = '34px system-ui, "PingFang SC", sans-serif'
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'
  ctx.fillText('🏠', HUB.x, HUB.y + 2)
  ctx.font = '12px system-ui, sans-serif'
  ctx.fillStyle = '#9aa6b8'
  ctx.fillText('Smart Home', HUB.x, HUB.y + 62)
}

function drawDevices(t) {
  for (let i = 0; i < DEVICES.length; i++) {
    const dev = DEVICES[i]
    const [r, g, b] = dev.color.split(',').map(Number)
    const breathe = 0.5 + 0.5 * Math.sin(t * 0.0018 + i * 1.3)
    // 设备光圈
    const glow = ctx.createRadialGradient(dev.x, dev.y, 0, dev.x, dev.y, 30 + 8 * breathe)
    glow.addColorStop(0, `rgba(${r},${g},${b},${0.28 + 0.2 * breathe})`)
    glow.addColorStop(1, `rgba(${r},${g},${b},0)`)
    ctx.fillStyle = glow
    ctx.beginPath(); ctx.arc(dev.x, dev.y, 30 + 8 * breathe, 0, TAU); ctx.fill()
    pulse(t, dev, i)
    // 图标
    ctx.font = '30px system-ui, "PingFang SC", sans-serif'
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'
    ctx.fillText(dev.icon, dev.x, dev.y + 1)
    // 名称
    ctx.font = '11px system-ui, sans-serif'
    ctx.fillStyle = 'rgba(154,166,184,0.8)'
    ctx.fillText(dev.name, dev.x, dev.y + 30)
  }
}

// ---------------------------------------------------------------------------
// 主循环
// ---------------------------------------------------------------------------
const start = performance.now()
function frame(now) {
  const t = now - start
  ctx.clearRect(0, 0, W, H)
  drawParticles(t)
  drawHub(t)
  drawDevices(t)
  requestAnimationFrame(frame)
}
requestAnimationFrame(frame)
</script>
</body>
</html>
