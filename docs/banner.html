<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>dsh-smarthome banner</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #04060b; }
  #scene { position: absolute; inset: 0; }
  .overlay {
    position: absolute; inset: 0; z-index: 2; pointer-events: none;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 108px 0 0 60px;
  }
  .title {
    font-size: 58px; font-weight: 800; letter-spacing: -1px; color: #f2f5fa;
    text-shadow: 0 0 18px rgba(77, 124, 254, .55), 0 0 46px rgba(77, 124, 254, .28);
  }
  .title .dot { color: #6ee7b7; text-shadow: 0 0 14px rgba(110, 231, 183, .8); }
  .zh1 { margin-top: 14px; font-size: 29px; color: #cfd8e6; font-weight: 700; }
  .zh2 {
    margin-top: 4px; font-size: 29px; font-weight: 800; color: #8fb2ff;
    text-shadow: 0 0 16px rgba(77, 124, 254, .45);
  }
  .en { margin-top: 8px; font-size: 15px; color: #6d7a90; letter-spacing: .3px; }
  .chips { margin-top: 16px; display: flex; gap: 10px; }
  .chip {
    font-size: 13px; padding: 6px 14px; border-radius: 99px; color: #e6e9ee;
    background: rgba(22, 25, 30, .82); border: 1px solid #2a3140;
    box-shadow: 0 0 14px rgba(77, 124, 254, .18);
  }
  .chip.hot { border-color: rgba(110, 231, 183, .6); color: #b9f3d8;
    box-shadow: 0 0 18px rgba(110, 231, 183, .35); }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="overlay">
  <div class="title">dsh-smarthome<span class="dot">.</span></div>
  <div class="zh1">一个插件接入 Home Assistant</div>
  <div class="zh2">完成智能家居全闭环</div>
  <div class="en">One plugin · Home Assistant · the full smart-home loop</div>
  <div class="chips">
    <span class="chip hot">⚡ 一键接入 dsh plugin add</span>
    <span class="chip">🔒 审批保护 · 实时状态</span>
  </div>
</div>
<script>
const canvas = document.getElementById('scene')
const ctx = canvas.getContext('2d')

const W = 1600, H = 500
canvas.width = W * 2
canvas.height = H * 2
canvas.style.width = W + 'px'
canvas.style.height = H + 'px'
ctx.scale(2, 2)

const TAU = Math.PI * 2
const rand = (a, b) => a + Math.random() * (b - a)

// ---------------------------------------------------------------------------
// 背景粒子（氛围，低调）
// ---------------------------------------------------------------------------
const PARTICLES = []
for (let i = 0; i < 90; i++) {
  PARTICLES.push({
    x: rand(0, W), y: rand(0, H),
    r: rand(0.6, 1.8),
    vx: rand(-0.14, 0.14), vy: rand(-0.1, 0.1),
    phase: rand(0, TAU), speed: rand(0.4, 1.2),
  })
}
function drawParticles(t) {
  for (const p of PARTICLES) {
    p.x += p.vx * p.speed; p.y += p.vy * p.speed
    if (p.x < -10) p.x = W + 10; if (p.x > W + 10) p.x = -10
    if (p.y < -10) p.y = H + 10; if (p.y > H + 10) p.y = -10
    const tw = 0.5 + 0.5 * Math.sin(t * 0.002 + p.phase)
    ctx.fillStyle = `rgba(120, 150, 210, ${0.16 + 0.3 * tw})`
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (0.7 + 0.6 * tw), 0, TAU); ctx.fill()
  }
  for (let i = 0; i < PARTICLES.length; i++) {
    for (let j = i + 1; j < PARTICLES.length; j++) {
      const a = PARTICLES[i], b = PARTICLES[j]
      const dx = a.x - b.x, dy = a.y - b.y, d2 = dx * dx + dy * dy
      if (d2 < 70 * 70) {
        ctx.strokeStyle = `rgba(110, 160, 255, ${(1 - Math.sqrt(d2) / 70) * 0.08})`
        ctx.lineWidth = 1
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke()
      }
    }
  }
}

// ---------------------------------------------------------------------------
// 链路：DSH → HA → 设备
// ---------------------------------------------------------------------------
const DSH = { x: 640, y: 250, w: 170, h: 78 }
const HA = { x: 900, y: 250, w: 170, h: 78 }

function roundRect(x, y, w, h, r) {
  ctx.beginPath()
  ctx.moveTo(x + r, y)
  ctx.arcTo(x + w, y, x + w, y + h, r)
  ctx.arcTo(x + w, y + h, x, y + h, r)
  ctx.arcTo(x, y + h, x, y, r)
  ctx.arcTo(x, y, x + w, y, r)
  ctx.closePath()
}

function drawNode(n, color, name, sub, pulseT) {
  const [r, g, b] = color.split(',').map(Number)
  const glow = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, 120)
  glow.addColorStop(0, `rgba(${r},${g},${b},${0.28 + 0.1 * Math.sin(pulseT * 0.003)})`)
  glow.addColorStop(1, `rgba(${r},${g},${b},0)`)
  ctx.fillStyle = glow
  ctx.fillRect(n.x - 120, n.y - 120, 240, 240)
  roundRect(n.x - n.w / 2, n.y - n.h / 2, n.w, n.h, 18)
  ctx.fillStyle = 'rgba(13, 16, 22, 0.92)'
  ctx.fill()
  ctx.strokeStyle = `rgba(${r},${g},${b},0.75)`
  ctx.lineWidth = 2
  ctx.stroke()
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'
  ctx.font = '800 30px system-ui, sans-serif'
  ctx.fillStyle = '#f2f5fa'
  ctx.fillText(name, n.x, n.y - 10)
  ctx.font = '600 13px system-ui, "PingFang SC", sans-serif'
  ctx.fillStyle = '#9aa6b8'
  ctx.fillText(sub, n.x, n.y + 18)
}

function drawLink(from, to, t, label) {
  const dx = to.x - from.x, dy = to.y - from.y
  const len = Math.hypot(dx, dy)
  const off = (t * 0.0006) % 1
  const px = from.x + dx * off, py = from.y + dy * off
  // 线
  const grad = ctx.createLinearGradient(from.x, from.y, to.x, to.y)
  grad.addColorStop(0, 'rgba(77,124,254,0.7)')
  grad.addColorStop(1, 'rgba(110,231,183,0.7)')
  ctx.strokeStyle = grad
  ctx.lineWidth = 2.4
  ctx.setLineDash([10, 7])
  ctx.lineDashOffset = -t * 0.12
  ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(to.x, to.y); ctx.stroke()
  ctx.setLineDash([])
  // 流动亮点
  const g1 = ctx.createRadialGradient(px, py, 0, px, py, 8)
  g1.addColorStop(0, 'rgba(180, 240, 255, 0.95)')
  g1.addColorStop(1, 'rgba(180, 240, 255, 0)')
  ctx.fillStyle = g1
  ctx.beginPath(); ctx.arc(px, py, 8, 0, TAU); ctx.fill()
  // 标签
  if (label) {
    ctx.font = '600 13px system-ui, "PingFang SC", sans-serif'
    ctx.fillStyle = '#cfd8e6'
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'
    ctx.fillText(label, (from.x + to.x) / 2, Math.min(from.y, to.y) - 14)
  }
}

// ---------------------------------------------------------------------------
// 设备集群（右侧两行，带状态点）
// ---------------------------------------------------------------------------
const DEVICES = [
  { icon: '💡', x: 1010, y: 128, name: 'light', color: '251,191,36', on: true },
  { icon: '❄️', x: 1170, y: 128, name: 'climate', color: '96,165,250', on: true },
  { icon: '🎥', x: 1330, y: 128, name: 'camera', color: '251,146,60', on: true },
  { icon: '📺', x: 1490, y: 128, name: 'media', color: '129,140,248', on: false },
  { icon: '🔌', x: 1010, y: 372, name: 'switch', color: '110,231,183', on: false },
  { icon: '🔒', x: 1170, y: 372, name: 'lock', color: '110,231,183', on: true },
  { icon: '🚪', x: 1330, y: 372, name: 'door', color: '148,163,184', on: false },
  { icon: '🎬', x: 1490, y: 372, name: 'scene', color: '232,121,249', on: true },
]

function drawDevices(t) {
  for (let i = 0; i < DEVICES.length; i++) {
    const d = DEVICES[i]
    const [r, g, b] = d.color.split(',').map(Number)
    const breathe = 0.5 + 0.5 * Math.sin(t * 0.002 + i * 1.2)
    // 控制线：HA → 设备
    const dx = d.x - HA.x, dy = d.y - HA.y
    const len = Math.hypot(dx, dy)
    const off = (t * 0.0007 + i * 0.14) % 1
    const px = HA.x + dx * off, py = HA.y + dy * off
    ctx.strokeStyle = `rgba(${r},${g},${b},0.22)`
    ctx.lineWidth = 1.2
    ctx.beginPath(); ctx.moveTo(HA.x + 30, HA.y + 20); ctx.lineTo(d.x - 40, d.y); ctx.stroke()
    const g1 = ctx.createRadialGradient(px, py, 0, px, py, 5)
    g1.addColorStop(0, `rgba(${r},${g},${b},0.9)`)
    g1.addColorStop(1, `rgba(${r},${g},${b},0)`)
    ctx.fillStyle = g1
    ctx.beginPath(); ctx.arc(px, py, 5, 0, TAU); ctx.fill()
    // 设备块
    roundRect(d.x - 62, d.y - 44, 124, 88, 16)
    ctx.fillStyle = 'rgba(16, 19, 25, 0.92)'
    ctx.fill()
    ctx.strokeStyle = `rgba(${r},${g},${b},${0.4 + 0.3 * breathe})`
    ctx.lineWidth = 1.6
    ctx.stroke()
    // 图标
    ctx.font = '32px system-ui, "PingFang SC", sans-serif'
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'
    ctx.fillText(d.icon, d.x, d.y - 8)
    // 名称
    ctx.font = '600 11px system-ui, sans-serif'
    ctx.fillStyle = '#8b93a1'
    ctx.fillText(d.name, d.x, d.y + 26)
    // 状态点
    ctx.fillStyle = d.on ? 'rgba(110,231,183,0.95)' : 'rgba(74,81,96,0.9)'
    ctx.beginPath(); ctx.arc(d.x + 44, d.y - 34, 3.5, 0, TAU); ctx.fill()
  }
}

// ---------------------------------------------------------------------------
// 主循环
// ---------------------------------------------------------------------------
const start = performance.now()
function frame(now) {
  const t = now - start
  ctx.clearRect(0, 0, W, H)
  drawParticles(t)
  drawLink(DSH, HA, t, '一键接入 · one-click')
  drawNode(DSH, '77,124,254', 'DSH', 'DeepSeek Harness', t)
  drawNode(HA, '110,231,183', 'HA', 'Home Assistant', t)
  drawDevices(t)
  requestAnimationFrame(frame)
}
requestAnimationFrame(frame)
</script>
</body>
</html>
